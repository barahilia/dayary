<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Dayary tests</title>

        <!-- Jasmine Framework. Plain scripts, so that jasmine's globals and
             its boot sequence are in place before the specs are evaluated. -->
        <link rel="stylesheet" type="text/css"
              href="/node_modules/jasmine-core/lib/jasmine-core/jasmine.css">

        <script src="/node_modules/jasmine-core/lib/jasmine-core/jasmine.js"></script>
        <script src="/node_modules/jasmine-core/lib/jasmine-core/jasmine-html.js"></script>
        <script src="/node_modules/jasmine-core/lib/jasmine-core/boot0.js"></script>
        <script src="/node_modules/jasmine-core/lib/jasmine-core/boot1.js"></script>

        <!-- Deferred, so it runs after the scripts above and before onload,
             which is when jasmine executes the suite. -->
        <script type="module" src="./main.js"></script>
    </head>

    <body>
    </body>
</html>
