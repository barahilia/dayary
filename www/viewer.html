<h2>{{record.created | date : 'EEEE, dd.MM.y, HH:mm'}}</h2>

<!-- TODO: not sure this is the best way to show/hide parts -->
<div ng-show="$state.current.name === 'records.item'">
    <div>
        <button class="btn btn-success" ng-click="startEdit()">
            Edit
        </button>

        <span class="bg-success-subtle float-end">
            {{record.text.length}} chars
        </span>
    </div>

    <br />

    <div ng-show="loadingRecord">
        <span class="fa fa-spinner fa-spin"></span>
    </div>

    <div id="text-viewer" ng-hide="loadingRecord">
        <p ng-repeat="paragraph in record.text.split('\n') track by $index">
            {{paragraph}}
        </p>
    </div>

    <span class="float-end">
        <span ng-show="record.device">
            written on {{record.device}} -
        </span>
        last updated on
        {{record.updated | date : 'EEEE, dd.MM.y, HH:mm'}}
    </span>
</div>

<div ng-hide="$state.current.name === 'records.item'">
    <div ui-view></div>
</div>
